<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기록 레시피">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>기록 레시피</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#EFE8DA;--paper:#FFFBF3;--ink:#2B2926;--sub:#7A746B;--line:#E6DCCB;--accent:#E8603C;--soft:#FCE6DE;--green:#3E8E6A;--lock:#CFC6B6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  textarea,input{font-family:inherit}
  .stage{display:flex;gap:40px;justify-content:center;align-items:center;min-height:100vh;padding:24px}
  .phone{position:relative;width:390px;height:800px;background:var(--paper);border-radius:40px;box-shadow:0 30px 60px rgba(60,40,20,.18),0 0 0 10px #2B2926;overflow:hidden;display:flex;flex-direction:column}
  .side{max-width:280px;font-size:14px;line-height:1.7;color:var(--sub)}
  .side h2{font-family:'Gowun Dodum';color:var(--ink);font-size:22px;margin-bottom:8px}
  @media (max-width:760px){.stage{padding:0}.side{display:none}.phone{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}}
  .top{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 10px}
  .logo{font-family:'Gowun Dodum';font-size:21px}.logo b{color:var(--accent);font-weight:400}
  .tr{display:flex;gap:8px;align-items:center}
  .streak{font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px}
  .gear{font-size:18px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line)}
  main{flex:1;overflow-y:auto;padding:6px 20px 24px}main::-webkit-scrollbar{width:0}
  .tabs{display:flex;border-top:1px solid var(--line);background:#fff;padding:8px 6px calc(12px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--sub);padding:6px 0}
  .tabs .ic{font-size:20px;filter:grayscale(1);opacity:.6}.tabs .on{color:var(--ink);font-weight:700}.tabs .on .ic{filter:none;opacity:1}
  .date{font-size:13px;color:var(--sub);margin:6px 0 10px}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 20px;box-shadow:0 6px 18px rgba(60,40,20,.06)}
  .qlabel{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:3px 10px;border-radius:99px;margin-bottom:12px}
  .qtext{font-family:'Gowun Dodum';font-size:24px;line-height:1.4;margin-bottom:6px}
  .qhint{font-size:13px;color:var(--sub);margin-bottom:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px}
  .chip:hover,.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font-size:15px;resize:none;background:var(--paper);outline:none;line-height:1.5}
  .inp:focus{border-color:var(--ink);background:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
  .btn{display:block;width:100%;margin-top:14px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:14px;text-align:center;text-decoration:none}
  .btn:disabled{background:var(--lock);cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.dark{background:var(--ink)}
  .btn.danger{background:#fff;color:#C0392B;border:1.5px solid #F0C9C2}
  .link{display:block;margin:14px auto 0;font-size:13px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
  .sec{font-family:'Gowun Dodum';font-size:19px;margin:22px 0 10px}
  .note{font-size:12.5px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.6}
  .done{background:var(--soft);border-radius:20px;padding:18px}
  .done small{font-size:12px;color:var(--accent);font-weight:700}
  .done .q{font-size:13px;color:var(--sub);margin:6px 0 4px}
  .done .a{font-family:'Gowun Dodum';font-size:21px;line-height:1.45}
  .done .edit{font-size:12.5px;color:var(--sub);text-decoration:underline;margin-top:8px}
  .past{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
  .past .when{font-size:12px;color:var(--accent);font-weight:700;margin-bottom:4px}
  .past .q{font-size:12px;color:var(--sub)}.past .a{font-size:15px;line-height:1.55;margin-top:2px}
  .locked{position:relative;margin-top:16px}.locked .blur{filter:blur(5px);pointer-events:none;user-select:none}
  .lockmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;font-size:14px;font-weight:700}
  .lockmsg span{font-weight:400;font-size:12.5px;color:var(--sub)}
  .cta{margin-top:16px;background:var(--ink);color:#fff;border-radius:20px;padding:18px}
  .cta small{color:#CFC6B6;font-size:12px}.cta h4{font-family:'Gowun Dodum';font-size:19px;font-weight:400;margin:4px 0 12px;line-height:1.4}.cta .btn{margin-top:0}
  .empty-past{border:1.5px dashed var(--lock);border-radius:18px;padding:16px;text-align:center;font-size:13.5px;color:var(--sub);line-height:1.6}
  .cats{display:flex;gap:7px;overflow-x:auto;margin:6px -20px 14px;padding:0 20px}.cats::-webkit-scrollbar{height:0}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fcard{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px;position:relative}
  .fcard .em{font-size:28px}.fcard .nm{font-weight:700;font-size:15px}.fcard .ds{font-size:12px;color:var(--sub);line-height:1.45;flex:1}
  .fcard .used{position:absolute;top:10px;right:10px;font-size:10.5px;color:var(--green);font-weight:700}
  .time{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;color:var(--green);background:#E3F1EA;border-radius:99px;padding:2px 8px}
  .hero{background:var(--soft);border-radius:18px;padding:16px;margin-bottom:14px}
  .hero h3{font-family:'Gowun Dodum';font-size:20px;font-weight:400;line-height:1.4}.hero p{font-size:12.5px;color:var(--sub);margin-top:4px}
  .back{font-size:14px;color:var(--sub);margin:4px 0 10px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}.dhead .em{font-size:40px}.dhead h2{font-family:'Gowun Dodum';font-size:24px;font-weight:400}
  .dbody{font-size:14px;line-height:1.65;color:#4A463F}
  .steps{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0}.steps li{font-size:14px;margin:4px 0 4px 18px}
  .ex{background:#fff;border:1px dashed #D4C9B5;border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:13.5px;line-height:1.6}
  .ex .q{color:var(--sub);font-size:12px}
  .prog{display:flex;gap:6px;margin:6px 0 18px}.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}.prog i.on{background:var(--accent)}
  .wstep{font-size:12.5px;color:var(--sub);margin-bottom:6px}.wq{font-family:'Gowun Dodum';font-size:24px;line-height:1.4;margin-bottom:16px}
  .two{display:flex;gap:8px}.two .btn{flex:1}
  .photo-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:220px;border:2px dashed var(--lock);border-radius:16px;color:var(--sub);font-size:14px;cursor:pointer;background:var(--paper);overflow:hidden}
  .photo-pick img{width:100%;height:100%;object-fit:cover}
  .week{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
  .day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--sub)}
  .dot{width:28px;height:28px;border-radius:50%;background:var(--paper);border:1.5px dashed var(--lock);display:flex;align-items:center;justify-content:center;font-size:14px}
  .dot.on{background:var(--accent);border:none;color:#fff}.dot.today{border-color:var(--ink);border-style:solid}
  .stats{display:flex;gap:10px;margin-bottom:6px}
  .stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
  .warn{display:flex;gap:10px;align-items:center;background:#FFF6DA;border-radius:14px;padding:12px 14px;font-size:13px;margin:10px 0;width:100%;text-align:left}
  .entry{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
  .entry .eh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-bottom:8px}
  .entry .eh b{color:var(--ink);font-size:13px}
  .entry .more{font-size:18px;color:var(--sub);padding:0 4px;line-height:1}
  .entry .l{font-size:14px;line-height:1.55;margin-bottom:6px;white-space:pre-wrap}.entry .l small{display:block;color:var(--sub);font-size:11.5px;white-space:normal}
  .entry img{width:100%;border-radius:10px;margin-top:4px}
  .empty{text-align:center;padding:40px 10px;color:var(--sub);font-size:14px;line-height:1.7}.empty .big{font-size:44px;margin-bottom:8px}
  .sheet-bg{position:absolute;inset:0;background:rgba(43,41,38,.45);display:flex;align-items:flex-end;z-index:5}
  .sheet{background:var(--paper);width:100%;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .25s ease}
  .sheet h3{font-family:'Gowun Dodum';font-size:21px;font-weight:400;margin-bottom:4px}
  .sheet .lbl{font-size:12.5px;color:var(--sub);margin:12px 0 6px}
  .menu button{display:block;width:100%;text-align:left;padding:14px 4px;font-size:15px;border-bottom:1px solid var(--line)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13.5px;padding:11px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:10}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{animation:pop .45s ease}@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <header class="top">
      <div class="logo">기록 <b>레시피</b></div>
      <div class="tr"><div class="streak" id="streak">🔥 0일</div><button class="gear" id="gear" aria-label="설정과 백업">⚙️</button></div>
    </header>
    <main id="view"></main>
    <nav class="tabs" id="tabs">
      <button data-tab="today"><span class="ic">✏️</span>오늘의 한 줄</button>
      <button data-tab="recipes"><span class="ic">📖</span>레시피</button>
      <button data-tab="me"><span class="ic">🗂️</span>내 기록</button>
    </nav>
    <div id="sheet"></div>
    <div class="toast" id="toast"></div>
  </div>
  <aside class="side">
    <h2>한 줄이면 충분해요</h2>
    <p>매일 질문 하나에 한 줄. 쓰고 나면 <b>지난날의 내가</b> 쓴 한 줄이 열려요. 더 쓰고 싶은 날엔 레시피를 따라 써 보세요.</p>
    <p style="margin-top:12px">휴대폰에서 열고 ⚙️ 설정의 <b>홈 화면에 설치</b>를 따라 하면 앱처럼 쓸 수 있어요. 기록은 이 기기에만 저장되니 가끔 <b>백업</b>해 주세요.</p>
  </aside>
</div>

  {id:"trip", em:"🧳", name:"여행·나들이 기록", time:"3분", cat:"여행", desc:"어디 갔는지, 제일 좋았던 순간, 다음에 또 갈지. 사진만 남기면 금방 잊혀요.",

  {id:"oneword", em:"🔤", name:"한 단어 일기", time:"30초", cat:"초간단", desc:"오늘을 딱 한 단어로. 기록이 처음이라면 여기서 시작하세요.",

/* ---------- 저장 ---------- */
let D={entries:[],lastBackup:null};
let storageOK=true;
function load(){
  try{
    const v=JSON.parse(localStorage.getItem(KEY)||"null");
    if(v){D=Object.assign(D,v);return;}
    const old=JSON.parse(localStorage.getItem("recipe-mvp")||"null"); // v0에서 넘어오기
    if(old&&old.entries) D.entries=old.entries.map(e=>{const [y,m,d]=e.date.split("-").map(Number);return {id:uid(),date:`${y}-${pad(m)}-${pad(d)}`,created:Date.now(),type:e.type,em:e.em,fmt:null,lines:e.lines};});
  }catch(e){storageOK=false;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true;}catch(e){if(e&&e.name==="QuotaExceededError"){toast("저장 공간이 부족해요. 백업 후 사진 기록을 정리해 주세요");return false;}storageOK=false;return true;}}
load();

function streak(){const days=new Set(D.entries.map(e=>e.date));let n=0;const d=new Date(today);if(!days.has(ymd(d)))d.setDate(d.getDate()-1);while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1);}return n;}
function addEntry(e){D.entries.unshift(Object.assign({id:uid(),date:TODAY,created:Date.now()},e));save();}

/* 지난날의 나: 1년 전·한 달 전·일주일 전 같은 날, 없으면 같은 질문에 예전에 쓴 답, 그래도 없으면 가장 오래된 한 줄 */
function pastMe(q){
  const ago=(n,unit)=>{const d=new Date(today);if(unit==="y")d.setFullYear(d.getFullYear()-n);else if(unit==="m")d.setMonth(d.getMonth()-n);else d.setDate(d.getDate()-n);return ymd(d);};
  const out=[];
  [["1년 전 오늘",ago(1,"y")],["한 달 전 오늘",ago(1,"m")],["일주일 전 오늘",ago(7,"d")]].forEach(([w,d])=>{const e=D.entries.find(x=>x.date===d);if(e)out.push({when:w,e});});
  if(!out.length&&q){const e=D.entries.find(x=>x.date!==TODAY&&x.lines[0]&&x.lines[0][0]===q);if(e)out.push({when:`${label(e.date)}, 같은 질문에`,e});}
  if(!out.length){const e=D.entries.filter(x=>x.date!==TODAY).slice(-1)[0];if(e)out.push({when:`${label(e.date)}의 나`,e});}
  return out;
}
const lineHTML=l=>String(l[1]).startsWith("data:image")?`<img src="${l[1]}" alt="기록 사진">`:esc(l[1]);
function pastCard({when,e}){return `<div class="past"><div class="when">${esc(when)} · ${e.em} ${esc(e.type)}</div>${e.lines.slice(0,2).map(l=>`<div class="q">${esc(l[0])}</div><div class="a">${lineHTML(l)}</div>`).join("")}</div>`;}

/* ---------- 오늘의 한 줄 ---------- */
function viewToday(){
  const t=todayLine();
  const dt=`${today.getMonth()+1}월 ${today.getDate()}일 ${"일월화수목금토"[today.getDay()]}요일`;
  if(!t||S.editToday){
    const [q,hint,,chips]=t?[t.lines[0][0],"고쳐 쓰고 저장하세요",null,null]:curQ();
    const past=pastMe(q);
    return `<p class="date">${dt}</p>
      <div class="qcard pop"><span class="qlabel">${t?"오늘의 한 줄 고치기":"오늘의 질문"}</span>
        <div class="qtext">${esc(q)}</div><p class="qhint">${esc(hint)}</p>
        ${chips?`<div class="chips">${chips.map(c=>`<button class="chip" data-quick="${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
        <textarea id="ans" class="inp" rows="2" maxlength="120" placeholder="한 줄이면 충분해요">${t?esc(t.lines[0][1]):""}</textarea>
        <div class="row"><span>${storageOK?"🔒 이 기기에만 저장돼요":"⚠️ 이 환경에선 저장이 안 돼요"}</span><span id="cnt">0/120</span></div>
        <button class="btn" id="post" ${t?"":"disabled"}>${t?"고친 내용 저장":"오늘의 한 줄 남기기"}</button>
        ${t?`<button class="btn ghost" id="cancelEdit">취소</button>`:""}
      </div>
      ${t?"":`<button class="link" id="shuffle">↻ 다른 질문 줄래요</button>
      ${past.length?`<div class="locked"><div class="blur">${pastCard(past[0])}</div><div class="lockmsg">🔒 오늘의 한 줄을 쓰면 열려요<span>${esc(past[0].when)}의 내가 기다리고 있어요</span></div></div>`:""}`}`;
  }
  const q=t.lines[0][0], past=pastMe(q), F=recipe((QUESTIONS.find(x=>x[0]===q)||[])[2]||"3line");
  return `<p class="date">${dt}</p>
    <div class="done pop"><small>✓ 오늘의 한 줄 완료 · 🔥 연속 ${streak()}일</small>
      <div class="q">${esc(q)}</div><div class="a">${esc(t.lines[0][1])}</div>
      <button class="edit" id="editToday">고치기</button></div>
    <p class="sec">🔓 지난날의 나</p>
    ${past.length?past.map(pastCard).join(""):`<div class="empty-past">아직 지난 기록이 없어요.<br>쓰다 보면 여기서 <b>일주일 전, 한 달 전의 나</b>를 다시 만나요.</div>`}
    ${F?`<div class="cta"><small>더 쓰고 싶은 날엔</small><h4>${F.em} ${F.name}(${F.time})로<br>조금 더 이어 써 볼래요?</h4><button class="btn" data-start="${F.id}">이어 쓰기</button></div>`:""}
    <p class="note">내일 또 새 질문이 기다려요</p>`;
}
function bindToday(){
  const a=$("#ans");if(!a)return;
  const upd=()=>{$("#cnt").textContent=`${a.value.length}/120`;$("#post").disabled=!a.value.trim();};upd();
  a.addEventListener("input",upd);
  document.querySelectorAll("[data-quick]").forEach(b=>b.onclick=()=>{a.value=b.dataset.quick+" ";a.focus();upd();});
  $("#post").onclick=()=>{const t=todayLine(),v=a.value.trim();
    if(t){t.lines[0][1]=v;S.editToday=false;save();render();toast("고쳤어요");return;}
    addEntry({kind:"line",type:"오늘의 한 줄",em:"✏️",fmt:null,lines:[[curQ()[0],v]]});render();toast("오늘의 한 줄 완료! 🎉");};
  const c=$("#cancelEdit");if(c)c.onclick=()=>{S.editToday=false;render();};
  const sh=$("#shuffle");if(sh)sh.onclick=()=>{S.qoff++;render();};
}

/* ---------- 레시피 ---------- */
function viewRecipes(){
  if(S.w) return viewWrite();
  if(S.fmt) return viewDetail();
  const used=new Set(D.entries.map(e=>e.fmt));
  const list=RECIPES.filter(f=>S.cat==="전체"||f.cat===S.cat);
  return `<div class="hero"><h3>뭘 써야 할지 모르겠다면<br>레시피대로 따라 써 보세요</h3><p>질문에 답하다 보면 기록이 완성돼요</p></div>
    <div class="cats">${CATS.map(c=>`<button class="chip ${S.cat===c?"on":""}" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="fgrid">${list.map(f=>`<button class="fcard" data-fmt="${f.id}">${used.has(f.id)?'<span class="used">✓ 써 봄</span>':""}<span class="em">${f.em}</span><span class="nm">${f.name}</span><span class="ds">${f.desc.split(".")[0]}.</span><span class="time">⏱ ${f.time}</span></button>`).join("")}</div>`;
}
function viewDetail(){
  const f=recipe(S.fmt),mine=D.entries.filter(e=>e.fmt===f.id).slice(0,2);
  return `<button class="back" id="back">← 레시피 목록</button>
    <div class="dhead"><span class="em">${f.em}</span><div><h2>${f.name}</h2><span class="time">⏱ ${f.time}</span></div></div>
    <p class="dbody">${f.desc}</p><p class="dbody" style="margin-top:8px"><b>이런 사람에게 좋아요</b> · ${f.who}</p>
    <div class="steps"><b style="font-size:13px">질문 ${f.steps.length}개</b><ol>${f.steps.map(s=>`<li>${s[0]}</li>`).join("")}</ol></div>
    <button class="btn" data-start="${f.id}">써 보기</button>
    ${mine.length?`<p class="sec">내가 이 레시피로 쓴 기록</p>${mine.map(e=>pastCard({when:label(e.date),e})).join("")}`
      :`<p class="sec">이렇게 쓸 수 있어요</p>${f.ex.map(e=>`<div class="ex">${e.map((a,j)=>`<div><span class="q">${f.steps[j][0]}</span><br>${esc(a)}</div>`).join('<div style="height:6px"></div>')}</div>`).join("")}`}`;
}
function viewWrite(){
  const f=recipe(S.w.id),i=S.w.step,s=f.steps[i];
  return `<button class="back" id="quit">✕ 그만 쓰기</button>
    <div class="prog">${f.steps.map((_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>
    <p class="wstep">${f.em} ${f.name} · ${i+1}/${f.steps.length}</p>
    <div class="wq pop">${s[0]}</div>
    ${s[2]==="photo"?`<label class="photo-pick">${S.w.ans[i]?`<img src="${S.w.ans[i]}" alt="고른 사진">`:`<span style="font-size:34px">📷</span>눌러서 사진 고르기`}<input type="file" id="ph" accept="image/*" hidden></label>`
      :`<textarea id="wa" class="inp" rows="3" maxlength="300" placeholder="${esc(s[1])}">${esc(S.w.ans[i]||"")}</textarea>`}
    <div class="row"><span>짧아도 괜찮아요</span><span></span></div>
    <div class="two">${i>0?`<button class="btn ghost" id="prev">이전</button>`:""}
      <button class="btn ${i===f.steps.length-1?"":"dark"}" id="next" ${S.w.ans[i]?"":"disabled"}>${i===f.steps.length-1?"기록 완성 🎉":"다음"}</button></div>`;
}
function bindRecipes(){
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;render();});
  document.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{S.fmt=b.dataset.fmt;render();});
  const bk=$("#back");if(bk)bk.onclick=()=>{S.fmt=null;render();};
  const q=$("#quit");if(q)q.onclick=()=>{S.w=null;render();};
  if(!S.w)return;
  const f=recipe(S.w.id),wa=$("#wa"),ph=$("#ph");
  if(wa){wa.focus();wa.oninput=()=>{S.w.ans[S.w.step]=wa.value;$("#next").disabled=!wa.value.trim();};}
  if(ph)ph.onchange=()=>{const file=ph.files[0];if(!file)return;const img=new Image();
    img.onload=()=>{const c=document.createElement("canvas"),r=Math.min(1,600/img.width);c.width=img.width*r;c.height=img.height*r;c.getContext("2d").drawImage(img,0,0,c.width,c.height);S.w.ans[S.w.step]=c.toDataURL("image/jpeg",.7);render();};
    img.src=URL.createObjectURL(file);};
  const p=$("#prev");if(p)p.onclick=()=>{S.w.step--;render();};
  $("#next").onclick=()=>{
    if(S.w.step<f.steps.length-1){S.w.step++;render();return;}
    addEntry({kind:"recipe",type:f.name,em:f.em,fmt:f.id,lines:f.steps.map((s,k)=>[s[0],String(S.w.ans[k]).trim()])});
    S.w=null;S.fmt=null;S.tab="me";render();toast(`${f.em} ${f.name} 완성!`);
  };
}

/* ---------- 내 기록 ---------- */
function viewMe(){
  const days=new Set(D.entries.map(e=>e.date));
  const mon=new Date(today);mon.setDate(today.getDate()-((today.getDay()+6)%7));
  const week=["월","화","수","목","금","토","일"].map((n,k)=>{const d=new Date(mon);d.setDate(mon.getDate()+k);const on=days.has(ymd(d)),t=ymd(d)===TODAY;return `<div class="day"><div class="dot ${on?"on":""} ${t?"today":""}">${on?"✓":""}</div>${n}</div>`;}).join("");
  const since=D.lastBackup?Math.floor((Date.now()-D.lastBackup)/864e5):null;
  const needBackup=D.entries.length>=3&&(since===null||since>=7);
  return `<div class="week">${week}</div>
    <div class="stats"><div class="stat"><b>${D.entries.length}</b><span>쌓인 기록</span></div><div class="stat"><b>🔥 ${streak()}</b><span>연속 기록일</span></div><div class="stat"><b>${days.size}</b><span>기록한 날</span></div></div>
    ${needBackup?`<button class="warn" id="goBackup">💾 <span>${since===null?"아직 백업한 적이 없어요":since+"일 동안 백업 안 했어요"}. 기록을 지키려면 백업해 주세요 →</span></button>`:""}
    <p class="sec">내 기록함</p>
    ${D.entries.length?D.entries.map(e=>`<div class="entry"><div class="eh"><b>${e.em} ${esc(e.type)}</b><span>${label(e.date)} <button class="more" data-more="${e.id}" aria-label="수정·삭제">⋯</button></span></div>
      ${e.lines.map(l=>`<div class="l"><small>${esc(l[0])}</small>${lineHTML(l)}</div>`).join("")}</div>`).join("")
    :`<div class="empty"><div class="big">🗒️</div>아직 기록이 없어요.<br>오늘의 질문에 한 줄만 써 볼까요?<button class="btn" id="go">한 줄 쓰러 가기</button></div>`}`;
}
function bindMe(){
  const g=$("#go");if(g)g.onclick=()=>{S.tab="today";render();};
  const b=$("#goBackup");if(b)b.onclick=()=>openSheet({k:"settings"});
  document.querySelectorAll("[data-more]").forEach(x=>x.onclick=()=>openSheet({k:"menu",id:x.dataset.more}));
}

/* ---------- 시트: 메뉴 · 수정 · 설정 ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;});
function openSheet(s){S.sheet=s;renderSheet();}
function closeSheet(){S.sheet=null;renderSheet();}
function renderSheet(){
  const box=$("#sheet"),s=S.sheet;if(!s){box.innerHTML="";return;}
  const e=s.id&&D.entries.find(x=>x.id===s.id);let body="";
  if(s.k==="menu") body=`<h3>${e.em} ${esc(e.type)}</h3><p class="qhint">${label(e.date)}</p>
    <div class="menu"><button id="mEdit">✏️ 수정하기</button><button id="mDel" style="color:#C0392B">🗑️ 삭제하기</button><button id="mClose">닫기</button></div>`;
  if(s.k==="del") body=`<h3>이 기록을 지울까요?</h3><p class="qhint">지우면 되돌릴 수 없어요.</p><div class="two"><button class="btn ghost" id="mClose">취소</button><button class="btn danger" id="mDelOk">삭제</button></div>`;
  if(s.k==="edit") body=`<h3>${e.em} 기록 수정</h3>${e.lines.map((l,i)=>String(l[1]).startsWith("data:image")?`<p class="lbl">${esc(l[0])}</p><img src="${l[1]}" style="width:100%;border-radius:12px" alt="">`
      :`<p class="lbl">${esc(l[0])}</p><textarea class="inp" rows="2" data-li="${i}">${esc(l[1])}</textarea>`).join("")}
    <div class="two"><button class="btn ghost" id="mClose">취소</button><button class="btn" id="mSave">저장</button></div>`;
  if(s.k==="settings"){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    body=`<h3>설정과 백업</h3>
      <p class="lbl">💾 백업 · 기록은 이 기기의 브라우저에만 저장돼요</p>
      <p class="qhint">${D.lastBackup?`마지막 백업: ${new Date(D.lastBackup).toLocaleDateString("ko-KR")}`:"아직 백업한 적이 없어요"} · 기록 ${D.entries.length}개</p>
      <button class="btn dark" id="bExport">백업 파일 내려받기</button>
      <label class="btn ghost" style="cursor:pointer">백업 파일 불러오기<input type="file" id="bImport" accept="application/json,.json" hidden></label>
      <button class="link" id="bCopy">파일 저장이 안 되면: 백업 내용을 복사하기</button>
      <p class="lbl" style="margin-top:22px">📱 홈 화면에 설치</p>
      ${installEvt?`<button class="btn" id="bInstall">앱처럼 설치하기</button>`
        :`<p class="qhint" style="line-height:1.6">${ios?"Safari 아래쪽 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 누르세요.":"Chrome 오른쪽 위 <b>⋮ 메뉴</b> → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요."}</p>`}
      <button class="btn ghost" id="mClose">닫기</button>`;
  }
  box.innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet">${body}</div></div>`;
  $("#sbg").onclick=ev=>{if(ev.target.id==="sbg")closeSheet();};
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f;};
  on("#mClose",closeSheet);
  on("#mEdit",()=>openSheet({k:"edit",id:s.id}));
  on("#mDel",()=>openSheet({k:"del",id:s.id}));
  on("#mDelOk",()=>{D.entries=D.entries.filter(x=>x.id!==s.id);save();closeSheet();render(true);toast("삭제했어요");});
  on("#mSave",()=>{document.querySelectorAll("[data-li]").forEach(t=>{const v=t.value.trim();if(v)e.lines[+t.dataset.li][1]=v;});save();closeSheet();render(true);toast("수정했어요");});
  on("#bExport",()=>{const blob=new Blob([JSON.stringify({app:"record-recipe",version:1,exported:new Date().toISOString(),entries:D.entries},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`기록레시피_백업_${TODAY}.json`;document.body.appendChild(a);a.click();a.remove();
    D.lastBackup=Date.now();save();renderSheet();toast("백업 파일을 내려받았어요");});
  on("#bCopy",async()=>{try{await navigator.clipboard.writeText(JSON.stringify({app:"record-recipe",version:1,entries:D.entries}));D.lastBackup=Date.now();save();toast("백업 내용을 복사했어요. 메모장에 붙여 넣어 보관하세요");}catch(err){toast("복사할 수 없는 환경이에요");}});
  const im=$("#bImport");
  if(im)im.onchange=async()=>{try{const v=JSON.parse(await im.files[0].text());if(!Array.isArray(v.entries))throw 0;
      const ids=new Set(D.entries.map(x=>x.id));let n=0;v.entries.forEach(x=>{if(x&&x.id&&x.date&&Array.isArray(x.lines)&&!ids.has(x.id)){D.entries.push(x);n++;}});
      D.entries.sort((a,b)=>(b.date+String(b.created)).localeCompare(a.date+String(a.created)));save();closeSheet();render();toast(`기록 ${n}개를 불러왔어요`);}
    catch(err){toast("백업 파일을 읽지 못했어요");}};
  on("#bInstall",async()=>{installEvt.prompt();await installEvt.userChoice;installEvt=null;renderSheet();});
}

/* ---------- 공통 ---------- */
function render(keep){
  const v=$("#view"),y=v.scrollTop;
  v.innerHTML=S.tab==="today"?viewToday():S.tab==="recipes"?viewRecipes():viewMe();
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  $("#streak").textContent=`🔥 ${streak()}일`;
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{S.tab="recipes";S.fmt=b.dataset.start;S.w={id:b.dataset.start,step:0,ans:[]};render();});
  if(S.tab==="today")bindToday();else if(S.tab==="recipes")bindRecipes();else bindMe();
  v.scrollTop=keep?y:0;
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.editToday=false;if(S.tab==="recipes"){S.fmt=null;S.w=null;}render();});
$("#gear").onclick=()=>openSheet({k:"settings"});
document.addEventListener("click",e=>{if(e.target.id==="editToday"){S.editToday=true;render();}});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
